<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 950" width="600" height="950">
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <filter id="qr-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.04"/>
    </filter>
    <style>
      .bg-card { fill: #FAFAFA; rx: 24px; }
      .qr-box { fill: #FFFFFF; stroke: #F0F0F0; stroke-width: 2; rx: 16px; filter: url(#qr-shadow); }
      .esewa-green { fill: #60BB46; }
      .text-name { font-family: 'Poppins', 'Inter', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 32px; fill: #1E293B; text-anchor: middle; }
      .text-phone { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 24px; fill: #64748B; text-anchor: middle; letter-spacing: 0.5px; }
      .text-footer { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 20px; fill: #334155; text-anchor: middle; }
      .esewa-title { font-family: 'Montserrat', 'Poppins', sans-serif; font-weight: 800; font-size: 38px; fill: #1E293B; }
      .esewa-tm { font-size: 16px; font-weight: 600; fill: #1E293B; }
    </style>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="20" y="20" width="560" height="910" rx="32" fill="#FAFAFA" filter="url(#card-shadow)" />

  <!-- QR Code White Box -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="480" height="480" rx="20" class="qr-box" />
    <g transform="translate(40, 40) scale(16)">
      <path fill="#FFFFFF" d="M0 0h23v23H0z"/><path stroke="#000000" d="M1 1.5h7m2 0h2m1 0h1m1 0h7M1 2.5h1m5 0h1m2 0h1m4 0h1m5 0h1M1 3.5h1m1 0h3m1 0h1m1 0h5m1 0h1m1 0h3m1 0h1M1 4.5h1m1 0h3m1 0h1m1 0h1m2 0h2m1 0h1m1 0h3m1 0h1M1 5.5h1m1 0h3m1 0h1m1 0h1m3 0h1m1 0h1m1 0h3m1 0h1M1 6.5h1m5 0h1m1 0h1m1 0h2m2 0h1m5 0h1M1 7.5h7m1 0h1m1 0h1m1 0h1m1 0h7M9 8.5h2M1 9.5h1m1 0h5m4 0h1m2 0h5M1 10.5h1m2 0h1m1 0h1m1 0h1m3 0h4m2 0h2M1 11.5h1m1 0h3m1 0h1m2 0h1m2 0h1m1 0h2m1 0h1m2 0h1M2 12.5h5m1 0h8m2 0h1m1 0h1M5 13.5h3m1 0h3m1 0h1m2 0h1m1 0h4M9 14.5h1m1 0h1m1 0h1m2 0h1m2 0h3M1 15.5h7m2 0h3m1 0h1m2 0h1m1 0h1m1 0h1M1 16.5h1m5 0h1m1 0h2m5 0h3m2 0h1M1 17.5h1m1 0h3m1 0h1m1 0h4m1 0h1m2 0h3M1 18.5h1m1 0h3m1 0h1m1 0h1m2 0h5M1 19.5h1m1 0h3m1 0h1m1 0h2m2 0h1m1 0h2m2 0h1M1 20.5h1m5 0h1m2 0h7m3 0h1M1 21.5h7m1 0h2m2 0h1m2 0h1m2 0h1"/>

    </g>
  </g>

  <!-- eSewa Brand Logo Group -->
  <g transform="translate(300, 600)">
    <!-- eSewa Circle Icon -->
    <g transform="translate(-110, -28)">
      <circle cx="24" cy="24" r="24" fill="#60BB46" />
      <path d="M24 10 C16 10 12 16 12 24 C12 32 16 38 24 38 C30 38 34 34 35 29 L28 29 C27 31 26 32 24 32 C20 32 18 28 18 25 L36 25 C36 24 36 23 36 22 C36 15 31 10 24 10 Z M18 21 C19 17 21 15 24 15 C27 15 29 17 29.5 21 L18 21 Z" fill="#FFFFFF" />
    </g>
    <!-- eSewa Text -->
    <text x="-50" y="8" class="esewa-title">eSewa<tspan class="esewa-tm">™</tspan></text>
  </g>

  <!-- Account Holder Name -->
  <text x="300" y="685" class="text-name">Anish Kumar Yadav</text>

  <!-- Phone Number -->
  <text x="300" y="730" class="text-phone">9845002168</text>

  <!-- Bottom Message -->
  <text x="300" y="830" class="text-footer">Show this QR code to receive money</text>
</svg>